name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto ningún trabajo recibe permisos; cada uno pide solo lo que usa.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Instala dependencias de npm y ejecuta código de compilación:
    # solo necesita leer el repositorio.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --testTimeout=60000
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Solo este trabajo publica en Pages y necesita el token OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
